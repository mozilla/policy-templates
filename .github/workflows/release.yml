name: Release

on:
  push:
    tags:
      - 'v*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Check out master rather than the tagged commit. The tag supplies only the
      # version number; the release is built from master's tip. This makes the
      # workflow tolerant of a tag pushed before a pull, which would otherwise
      # leave the bump commit unable to fast-forward into master. The tag is
      # re-pointed at the resulting commit further down, so tag and release still
      # agree. Building from master also means docs/oma-uris.md is regenerated
      # from a tree containing everything merged, not just what the tag saw.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Note if the tag was behind master
        run: |
          TAGGED="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          if [ "$TAGGED" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME points at $TAGGED but master is at $(git rev-parse HEAD). Releasing master; the tag will be moved to match."
          fi

      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet

      - name: Extract version (strip leading 'v')
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Bump ADMX/ADML revision numbers
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # xmlstarlet ed on ubuntu-latest doesn't accept -N for namespace binding
          # (that's a sel option), so we use local-name() to match elements
          # regardless of the ADMX default namespace.
          xmlstarlet ed -P --inplace --update "/*[local-name()='policyDefinitions']/@revision" -v "$VERSION" windows/firefox.admx
          xmlstarlet ed -P --inplace --update "/*[local-name()='policyDefinitions']/*[local-name()='resources']/@minRequiredRevision" -v "$VERSION" windows/firefox.admx
          for locale in de-DE en-US ru-RU fr-FR; do
            xmlstarlet ed -P --inplace --update "/*[local-name()='policyDefinitionResources']/@revision" -v "$VERSION" "windows/$locale/firefox.adml"
          done

      - name: Regenerate OMA-URIs reference
        run: python3 scripts/generate_oma_uris.py > docs/oma-uris.md

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windows/firefox.admx windows/de-DE/firefox.adml windows/en-US/firefox.adml windows/ru-RU/firefox.adml windows/fr-FR/firefox.adml docs/oma-uris.md
          if git diff --staged --quiet; then
            echo "Revision numbers already current; nothing to commit."
          else
            git commit -m "Bump version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:master
          fi

      # The tag triggers this workflow, so the bump commit is necessarily a child
      # of the tagged commit - meaning the tag's own tree would still carry the
      # previous release's revision numbers. Re-point the tag at the bump commit
      # so browsing the repo at the tag shows the revision that tag released.
      # HEAD is a direct descendant of the original tag, so nothing is lost.
      #
      # This does not retrigger the workflow: GitHub does not start new runs for
      # pushes made with the default GITHUB_TOKEN. If this is ever switched to a
      # PAT, this step becomes an infinite loop.
      - name: Move tag to the version-bump commit
        run: |
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push --force origin "refs/tags/$GITHUB_REF_NAME"

      - name: Create release ZIP
        run: |
          zip -r "policy_templates_${GITHUB_REF_NAME}.zip" docs/ mac/ windows/ linux/ LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Firefox Policy Templates Version ${{ steps.version.outputs.version }}" \
            --notes-file .github/release-notes-template.md \
            --draft \
            "policy_templates_${GITHUB_REF_NAME}.zip"
